<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Receptionist | White-Label Solution for Agencies</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/gh/vapi-ai/js-sdk@latest/dist/vapi-sdk.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-image 0.5s ease-in-out;
        }
        .glow-dental { box-shadow: 0 0 20px #10b981; }
        .glow-spa { box-shadow: 0 0 20px #D4AF37; }
        .chat-popup { transition: all 0.3s ease-in-out; }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#0f172a',
                        'soft-gold': '#D4AF37',
                        'mint-green': '#10b981',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-gray-300 antialiased overflow-x-hidden">

    <div id="app" class="relative min-h-screen flex flex-col items-center justify-center p-4">
        
        <div class="absolute top-0 left-0 w-96 h-96 rounded-full mix-blend-screen filter blur-3xl opacity-20 bg-mint-green" id="bg-glow"></div>

        <main class="z-10 container mx-auto text-center max-w-4xl py-20">
            <section>
                <h1 class="text-4xl sm:text-6xl font-extrabold text-white tracking-tight">
                    Never Miss a High-Value <span id="niche-text-accent" class="text-mint-green">Patient</span> Again.
                </h1>
                <p class="mt-6 text-xl text-gray-400">The AI Receptionist that books and upsells—while you sleep.</p>
                
                <button id="main-cta-button" class="mt-10 px-10 py-5 text-xl font-bold text-white rounded-full bg-mint-green glow-dental transition-all hover:scale-105">
                    Talk to Our AI Now
                </button>
            </section>

            <section class="mt-20">
                <div class="flex justify-center gap-4">
                    <button id="dental-btn" class="px-6 py-3 rounded-lg border-2 border-mint-green bg-mint-green text-white">Dental Clinic</button>
                    <button id="spa-btn" class="px-6 py-3 rounded-lg border-2 border-gray-600 text-gray-400">Spa & Salon</button>
                </div>
            </section>
        </main>

        <div id="voice-widget" class="fixed bottom-6 left-6 z-50 cursor-pointer group">
            <div id="voice-bg" class="flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full shadow-lg transition-all group-hover:scale-110">
                <div id="voice-pulse" class="animate-ping absolute h-16 w-16 rounded-full bg-blue-400 opacity-75"></div>
                <svg id="v-icon" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
            </div>
        </div>

        <div id="chat-widget" class="fixed bottom-6 right-6 z-50 cursor-pointer">
            <div class="flex items-center justify-center w-16 h-16 bg-gray-700 rounded-full shadow-lg">
                <svg class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
            </div>
        </div>

        <div id="chat-popup" class="hidden fixed bottom-24 right-6 w-80 h-96 bg-slate-800 rounded-xl shadow-2xl z-50 border border-slate-700 flex flex-col">
            <div class="p-4 border-b border-slate-700 font-bold">AI Chatbot Assistant</div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto text-sm space-y-2">
                <div class="bg-slate-700 p-2 rounded">Hello! How can I help?</div>
            </div>
            <div class="p-2 border-t border-slate-700 flex">
                <input id="chat-input" type="text" class="bg-slate-900 flex-1 p-2 rounded-l text-sm outline-none" placeholder="Type here...">
                <button id="send-chat" class="bg-mint-green px-3 rounded-r text-white">Send</button>
            </div>
        </div>
    </div>

    <script>
        // --- KEYS ---
        const VAPI_PUBLIC_KEY = '5c3d095d-a33e-4f04-911f-ebcb977afb2b';
        const ASSISTANTS = {
            dental: 'ba264f76-c73d-4515-af59-7b3572394e22',
            spa: '0384a330-e7a7-48fc-9514-0be4908a7605'
        };

        let currentNiche = 'dental';
        const vapi = new Vapi(VAPI_PUBLIC_KEY);

        // --- UI Updates ---
        const dentalBtn = document.getElementById('dental-btn');
        const spaBtn = document.getElementById('spa-btn');
        const nicheTxt = document.getElementById('niche-text-accent');
        const mainBtn = document.getElementById('main-cta-button');

        dentalBtn.onclick = () => {
            currentNiche = 'dental';
            nicheTxt.innerText = 'Patient';
            nicheTxt.className = 'text-mint-green';
            mainBtn.className = 'mt-10 px-10 py-5 text-xl font-bold text-white rounded-full bg-mint-green glow-dental transition-all hover:scale-105';
            dentalBtn.className = 'px-6 py-3 rounded-lg border-2 border-mint-green bg-mint-green text-white';
            spaBtn.className = 'px-6 py-3 rounded-lg border-2 border-gray-600 text-gray-400';
        };

        spaBtn.onclick = () => {
            currentNiche = 'spa';
            nicheTxt.innerText = 'Client';
            nicheTxt.className = 'text-soft-gold';
            mainBtn.className = 'mt-10 px-10 py-5 text-xl font-bold text-white rounded-full bg-soft-gold glow-spa transition-all hover:scale-105';
            spaBtn.className = 'px-6 py-3 rounded-lg border-2 border-soft-gold bg-soft-gold text-white';
            dentalBtn.className = 'px-6 py-3 rounded-lg border-2 border-gray-600 text-gray-400';
        };

        // --- VOICE LOGIC ---
        const handleCall = () => {
            vapi.start(ASSISTANTS[currentNiche]);
        };

        vapi.on('call-start', () => {
            document.getElementById('voice-bg').classList.replace('bg-blue-600', 'bg-red-600');
            document.getElementById('voice-pulse').classList.add('hidden');
        });

        vapi.on('call-end', () => {
            document.getElementById('voice-bg').classList.replace('bg-red-600', 'bg-blue-600');
            document.getElementById('voice-pulse').classList.remove('hidden');
        });

        mainBtn.onclick = handleCall;
        document.getElementById('voice-widget').onclick = handleCall;

        // --- CHAT LOGIC ---
        const chatPop = document.getElementById('chat-popup');
        document.getElementById('chat-widget').onclick = () => chatPop.classList.toggle('hidden');
        
        // INTEGRATE YOUR CHATBOT HERE:
        document.getElementById('send-chat').onclick = () => {
            const val = document.getElementById('chat-input').value;
            if(!val) return;
            const msgBox = document.getElementById('chat-messages');
            msgBox.innerHTML += `<div class="text-right"><span class="bg-blue-600 p-2 rounded inline-block mb-2 text-xs">${val}</span></div>`;
            document.getElementById('chat-input').value = '';
            
            // Example: If you have an AI endpoint, call it here with fetch()
        };
    </script>
</body>
</html>
